apiVersion: batch/v1
kind: Job
metadata:
  name: load
spec:
  activeDeadlineSeconds: 330
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: load
        image: docker.io/library/python:3.12-slim
        command: [python, -u, /opt/load/load.py]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
        volumeMounts:
        - name: code
          mountPath: /opt/load
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: code
        configMap:
          name: load-code
