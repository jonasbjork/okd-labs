---
apiVersion: v1
kind: Pod
metadata:
  name: schedule-test
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  containers:
  - name: test
    image: docker.io/library/python:3.12-slim
    command:
    - sleep
    - '300'
    resources:
      requests:
        cpu: '100000'
        memory: 32Mi
      limits:
        cpu: '100000'
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
