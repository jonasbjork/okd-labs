---
apiVersion: v1
kind: Pod
metadata:
  name: memory-test
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  containers:
  - name: test
    image: docker.io/library/python:3.12-slim
    command:
    - python
    - "-c"
    - import time; data = bytearray(128 * 1024 * 1024); time.sleep(60)
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
